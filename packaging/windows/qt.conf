; Pins Qt to the flat, app-local layout that windeployqt produces.
;
; Without this, Qt 6 works out where its plugins and QML modules live by
; measuring from Qt6Core.dll -- which lands on the layout of the machine that
; built it (MSYS2 keeps them under share/qt6/) rather than the folder the app
; was deployed into. The result is a viewer that starts and then fails with
; "module QtQuick is not installed".
[Paths]
Prefix = .
Libraries = .
LibraryExecutables = .
Plugins = .
Imports = qml
Qml2Imports = qml
